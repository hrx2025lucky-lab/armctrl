name: pages

# 站点发布方式：gh-pages 分支（Pages 源已固定为它）。
#
# 为什么不用 actions/deploy-pages：那条路要求 Pages 源设成「GitHub Actions」，
# 而切换源需要管理员权限。实测工作流自带的 GITHUB_TOKEN **无权创建/切换**
# Pages 站点（Resource not accessible by integration）。
# 推 gh-pages 分支则会让 GitHub 自动把站点开起来，不需要任何手工设置。
#
# 站点内容由两部分拼起来：
#   site/    页面本体（index.html、.nojekyll）
#   media/   录像与配图（主分支里只存这一份，站点引用它）
# 这样资源不用在仓库里存两遍。

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "media/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write        # 需要往 gh-pages 分支推

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0        # 要完整历史才能切到 gh-pages

      - name: 组装站点并同步到 gh-pages
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 先把站点拼好放到临时目录（切分支后 site/ 和 media/ 就不在了）
          tmp="$(mktemp -d)"
          cp -r site/. "$tmp/"
          mkdir -p "$tmp/media"
          cp -r media/. "$tmp/media/"

          git checkout gh-pages
          # 只删站点文件，别碰 .git
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r "$tmp"/. .

          git add -A
          if git diff --cached --quiet; then
            echo "站点内容没有变化，跳过提交"
            exit 0
          fi
          git commit -m "site: 同步 site/ + media/（${GITHUB_SHA::7}）"
          git push origin gh-pages
