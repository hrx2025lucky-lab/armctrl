name: tests

# 为什么要有 CI：README 里写「723 个测试全部通过」，那只是**自称**。
# 只有在一台干净机器上从零装起来跑一遍，这句话才算有证据。
# 顺带它也持续验证「clone 下来能跑」——这个仓库出过一次
# 「文档引用的脚本只存在于作者本机」的问题。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Panda 模型来自第三方资产仓库（Apache-2.0），不随本仓库分发。
      # 只取最新一次提交（--depth 1）：完整历史 500 MB+，这里只要文件。
      - name: 获取 mujoco_menagerie
        run: |
          git clone --depth 1 \
            https://github.com/google-deepmind/mujoco_menagerie.git \
            "$HOME/mujoco_menagerie"

      # ⭐ 先做环境自检再跑测试：缺模型时会得到一条带安装指引的明确报错，
      # 而不是几百个 "ParseXML: Error opening file" 天书。
      - name: 环境自检
        run: |
          export MUJOCO_MENAGERIE="$HOME/mujoco_menagerie"
          PYTHONPATH=. python -c \
            "from armctrl.assets import require_panda_xml; print(require_panda_xml())"

      - name: 跑全量测试
        env:
          MUJOCO_GL: egl          # runner 无显示器，必须用离屏渲染
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          export MUJOCO_MENAGERIE="$HOME/mujoco_menagerie"
          PYTHONPATH=. python -m unittest discover -s armctrl/tests -t . -v 2>&1 \
            | grep -v "Polishing"

      # 一组永远不会红的测试等于没有测试。这一步把实现改坏，确认测试真的会红。
      # 只跑一个批次（约 3 分钟）作为抽样；全部批次要 20 分钟以上。
      - name: 变异抽检（确认测试不是摆设）
        env:
          MUJOCO_GL: egl
        run: |
          export MUJOCO_MENAGERIE="$HOME/mujoco_menagerie"
          PYTHONPATH=. python tools/verification/mut_h_splice.py

      # 变异脚本会临时改写源文件再写回。万一异常退出留下改动，这里要发现。
      - name: 确认工作区干净（变异没有残留）
        run: |
          if ! git diff --quiet; then
            echo "::error::变异脚本留下了未还原的改动"
            git --no-pager diff --stat
            exit 1
          fi
          echo "工作区干净"
